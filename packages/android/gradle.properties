# PushHub Android（packages/android）Gradle 配置
#
# JDK 指向（本机 JAVA_HOME 未设——RESEARCH §Environment Availability 既定兜底）：
# Gradle 9.5.0 / AGP 9.3.2 需 JDK 17+，本机 JDK 21.0.10 LTS。
# 路径用正斜杠避免 properties 转义问题。
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10

# AndroidX（specialUse FGS 依赖 LifecycleService 等 androidx 栈）
android.useAndroidX=true

# Gradle 守护进程内存（AGP 9 + Kotlin K2 编译基线）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
