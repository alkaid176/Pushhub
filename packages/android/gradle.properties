# PushHub Android（packages/android）Gradle 配置
#
# JDK：Gradle 9.5.0 / AGP 9.3.2 需 JDK 17+。本文件**不携带 org.gradle.java.home**
# （WR-05 修复：机器特定绝对路径入库会把本地环境约束强加给所有构建方/CI，
# 他机路径不存在即构建失败）。Gradle 按标准顺序解析 JVM：JAVA_HOME 环境变量
# → PATH 中的 java。本机 JAVA_HOME 未设时的本地兜底：写**用户级**
# ~/.gradle/gradle.properties（GRADLE_USER_HOME，不入库），例如：
#   org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10
# （路径用正斜杠避免 properties 转义问题；详见 DEPLOY.md 安卓端章节。）

# AndroidX（specialUse FGS 依赖 LifecycleService 等 androidx 栈）
android.useAndroidX=true

# Gradle 守护进程内存（AGP 9 + Kotlin K2 编译基线）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
