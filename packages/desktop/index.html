<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushHub</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 8px 12px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.35);
        font-size: 13px;
      }
      #status {
        font-weight: 600;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        font-size: 14px;
      }
      .msg {
        padding: 4px 0;
        border-bottom: 1px solid rgba(128, 128, 128, 0.15);
      }
      .msg .msg-title {
        font-weight: 600;
      }
      .msg .msg-text {
        white-space: pre-wrap;
      }
      #empty {
        color: rgba(128, 128, 128, 0.9);
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <header>状态: <span id="status">offline</span></header>
    <main id="messages">
      <div id="empty">未配置频道——前端窗口为纯展示层（D-60），连接归 Rust 进程持有。</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
