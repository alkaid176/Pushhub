<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushHub</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header"><span class="app-name">PushHub</span></div>
        <nav id="channel-list" aria-label="频道列表"></nav>
        <div class="sidebar-footer">
          <button id="btn-add-channel" class="sidebar-btn" type="button">＋ 添加频道</button>
          <button id="btn-settings" class="sidebar-btn" type="button">设置</button>
        </div>
      </aside>
      <main id="main">
        <header id="main-header">
          <span id="current-channel-name">未配置频道</span>
          <span id="status" class="status">—</span>
        </header>
        <div id="message-scroll">
          <div id="messages"></div>
        </div>
        <footer id="reply-area" hidden></footer>
      </main>
    </div>
    <!-- 向导/设置面板模态层（05-06 Task 2 组件挂载点，D-73 单窗口单心智） -->
    <div id="overlay" hidden></div>
    <!-- 首关一次性提示层（05-06 Task 2 setup.ts，D-71） -->
    <div id="hint-layer" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
